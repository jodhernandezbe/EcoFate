[project]
name = "ecofate"
version = "0.1.0"
description = "Screening-level chemical exposure risk assessments from unified TRI data and transport models"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Jose Hernandez-Betancur" }]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "celery[redis]>=5.7.0",
    "chromadb>=1.5.9",
    "cryptography>=46.0.0",
    "email-validator>=2.3.0",
    "evidently>=0.7.23,<0.8",
    "fastapi>=0.156.4",
    "httpx>=0.28.1",
    "jupyter>=1.0.0",
    "keyring>=25.7.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=1.7.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=3.2.0",
    "logfire[celery]>=5.4.0",
    "minsearch>=0.0.5",
    "numpy>=2.0.0",
    "openai>=1.50.0",
    "pint>=0.26.1",
    "psycopg[binary,pool]>=3.3.8",
    "pyarrow>=26.0.0",
    "python-docx>=1.1.2",
    "python-dotenv>=1.0.0",
    "rdkit>=2026.9.1",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "torch>=2.14.1",
    "transformers>=5.20.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "bandit[toml]>=1.7.0",
    "detect-secrets>=1.5.0",
    "pip-audit>=2.7.0",
    "pre-commit>=4.0.0",
    "pyright>=1.1.380",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

# PyTorch on Linux (the Docker image) comes from the CPU-only wheel index, so the image carries
# no CUDA libraries the read-across encoder never uses. macOS keeps the PyPI wheel.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "FA", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN401"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = '-m "not smoke and not eval and not postgres and not redis"'
markers = [
    "smoke: live-network checks against real services (run with: pytest -m smoke)",
    "comptox: smoke test that needs the CompTox API key (skipped when it is not set)",
    "census: smoke test that needs the Census API key (skipped when it is not set)",
    "logfire: smoke test that needs the Logfire read token (skipped when it is not set)",
    "postgres: tests against a real PostgreSQL (run with: make test-db; needs ECOFATE_TEST_DATABASE_URL)",
    "eval: agent evaluation with a real chat model (run with: pytest -m eval)",
    "redis: tests against a real Redis (run with: pytest -m redis; needs ECOFATE_TEST_REDIS_URL)",
]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["agent", "app", "api", "commons", "config", "evals", "models", "prompts", "scripts", "storage", "tools", "tests", "worker"]
venvPath = "."
venv = ".venv"
# langgraph ships partial typing; keep strict for our code, tolerate its gaps.
reportMissingTypeStubs = false
reportUnknownMemberType = false

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
