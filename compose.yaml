# EcoFate local stack: `docker compose up --build`, then open http://127.0.0.1:8000.
# Keys come from `.env` (copy `.env.example`); the OS keychain does not exist in the container.
# PostgreSQL (`db`) keeps the conversations; `migrate` applies the schema before `api` starts.
name: ecofate

x-database-url: &database-url
  # Built from the POSTGRES_* values in .env; points at the `db` service on the compose network.
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}

x-api-build: &api-build
  context: .
  target: api

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10
    # Not published: reachable only on the compose network. `make db` (profile dev) adds `db-port`.

  db-port:
    # Development only (`--profile dev`): forwards the host's loopback port 5432 to `db`, for
    # native runs and `make test-db`. Never on all interfaces.
    profiles: [dev]
    image: alpine/socat:1.8.0.3
    command: ["tcp-listen:5432,fork,reuseaddr", "tcp-connect:db:5432"]
    ports:
      - "127.0.0.1:5432:5432"  # host loopback only
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    # One shot: `python -m storage upgrade`, then exit. Gets only the database URL, no API key.
    build: *api-build
    image: ecofate-api:local
    command: ["python", "-m", "storage", "upgrade"]
    environment:
      <<: *database-url
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"

  api:
    build: *api-build
    image: ecofate-api:local
    env_file: .env
    environment:
      <<: *database-url
    ports:
      - "127.0.0.1:8000:8000"  # host loopback only; never on all interfaces
    volumes:
      - ecofate-cache:/app/.cache
      - hf-cache:/home/ecofate/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

volumes:
  ecofate-cache:
  hf-cache:
  pgdata:
