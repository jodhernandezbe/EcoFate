no_assessor_summary = "No assistant summary is available for this assessment."
empty_section = "No result was reported for this section."
not_reported = "not reported"
file_name = "exposure-screening-{cas}-{date}.docx"
# Page header of every page: the app logo (PNG, relative to the project root; a copy of
# frontend/public/logo.svg) beside the app name.
brand = "EcoFate · Exposure & Risk Studio"
logo = "api/assets/report-logo.png"
# Page footer: {page} and {pages} become Word fields, so Word keeps them current.
page_label = "Page {page} of {pages}"

[ui.report.headings]
