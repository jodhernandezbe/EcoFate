# Token prices per chat model, USD per million tokens, with the date and page they were taken
# from. A model without an entry is shown as "unpriced"; never fill these from memory.
[ui.pricing]

# "Standard pricing data" table (not batch, not fast/priority): Input, Output, Cached input.
# The model page https://platform.openai.com/docs/models/gpt-4.1 lists the same three prices.
[ui.pricing."gpt-4.1"]
input_usd_per_mtok = 2.00
cached_input_usd_per_mtok = 0.50
output_usd_per_mtok = 8.00
priced_on = 2026-10-20
source_url = "https://platform.openai.com/docs/pricing"

# Census Bureau Quarterly Survey of Plant Capacity Utilization (QPC): the developer script
# scripts/build_census_qpc_baseline.py downloads one quarterly workbook and writes the average
# plant hours per week by four-digit NAICS code to `output_path`. Run it with:
# uv run python -m scripts.build_census_qpc_baseline
[qpc]
# Workbook of a release; {year} is four digits, {quarter} is 1-4. Only https on `allowed_host`.
url_template = "https://www2.census.gov/programs-surveys/qpc/tables/{year}/{year}-qtr-table-final-q{quarter}.xlsx"
allowed_host = "www2.census.gov"
# A release is published about 2.5 months after its quarter ends, so the newest quarter is not
# there yet: use the one this many quarters before the current one (2026 Q4 -> 2026 Q2).
lag_quarters = 2
# The tab, the header labels (whitespace and case ignored) and the title cell (A1) to look for.
sheet_name = "FULL Utilization Rates"
code_header = "NAICS Code(s)"
hours_header = "Average plant hours per week in operation"
# Named groups `year` and `quarter` of the sheet title, e.g. "... Full Rates: 2026 Quarter 2".
title_pattern = "(?P<year>\\d{4}) Quarter (?P<quarter>[1-4])"
# The workbook must state this NAICS edition; the pattern's group `edition` is searched for in
# `intro_sheet_name`. The four-digit codes of another edition are not comparable.
intro_sheet_name = "Introduction"
naics_edition = 2022
# Column of the NAICS titles table ([industry].titles_path) that says which edition a code is from;
# the four-digit children of a three-digit row are the codes of `naics_edition` under it.
titles_vintage_column = "vintage"
naics_edition_pattern = "(?P<edition>\\d{4}) edition of the North American Industry Classification"
# Plausible hours per week: more than `min_hours` (exclusive) and at most `max_hours_per_week`
# (24 h x 7 d = 168, continuous operation, is valid).
min_hours = 0
max_hours_per_week = 168
# Fewer four-digit codes than this means the layout changed; the file is not written.
min_codes = 50
# How many rows from the top the header row may be.
header_search_rows = 15
timeout_seconds = 30
max_bytes = 5_000_000
output_path = "data/census_qpc_baseline.parquet"

# Operating hours by industry (tools/emissions/helpers/inventory/plant_hours.py): a facility's
# primary NAICS code is matched, most specific first (its own length down to `min_digits`),
# against the Census QPC baseline built by scripts/build_census_qpc_baseline.py; the matched
# average plant hours per week become operating hours per year as h/week x days_per_year / 7
# (168 h/week = 8760 h/yr). No match: [emissions].operating_hours_per_year.
[plant_hours]
baseline_path = "data/census_qpc_baseline.parquet"
code_column = "naics_code"
hours_column = "avg_plant_hours_per_week"
min_digits = 3
max_digits = 6
days_per_year = 365
# Rows above this many hours per week (hours in a week) are not plausible and are ignored.
max_hours_per_week = 168
# QPC gives hours per week, not days. A plant's days per week is derived as the hours per week over
# this working-day length, rounded up and at most 7 (40 h -> 5 days of 8 h; 168 h -> 7 days of 24 h).
shift_hours_per_day = 8

# TSCA conditions of use and life cycle stages of a facility (tools/emissions/helpers/inventory/
# conditions.py). The TRI release query joins `tri_chem_activity` (one row per submission with a
# 0/1 flag per Form R Section 3 activity); each flag set in a facility's latest-year submissions
# is mapped through the EPA crosswalk to a life cycle stage and condition-of-use category. Only
# rows of `level` with no TRI sub-use code are used (Envirofacts has no sub-use table).
[conditions_of_use]
crosswalk_path = "data/tsca_cou_cdr_tri_crosswalk.csv"
level = "1_lifecycle_stage"
# Crosswalk columns.
level_column = "mapping_level"
section_column = "tri_form_r_section"
subuse_column = "tri_subuse_code"
stage_column = "tsca_lifecycle_stage"
category_column = "tsca_cou_category"
strength_column = "mapping_strength"
activity_column = "tri_activity_category"
# Pulls the section ("3.2b") out of the crosswalk's "Part II Section 3.2b" (group `section`).
section_pattern = "Section (?P<section>3\\.[123][a-f])\\b"

# `tri_chem_activity` flag column -> Form R Section 3 activity (3.1 manufacture, 3.2 process,
# 3.3 otherwise use).
[conditions_of_use.flags]
produce = "3.1a"
imported = "3.1b"
used_processed = "3.1c"
sale_distribution = "3.1d"
byproduct = "3.1e"
manufacture_impurity = "3.1f"
reactant = "3.2a"
formulation_component = "3.2b"
article_component = "3.2c"
repackaging = "3.2d"
process_impurity = "3.2e"
processed_recycling = "3.2f"
chem_processing_aid = "3.3a"
manufacture_aid = "3.3b"
ancillary = "3.3c"

# Values the user may enter when a chemical benchmark is missing (missing-value confirmation).
# Per quantity: the units accepted on the entry. The first one is the target unit the analysis
# uses, and must equal the unit the matching setting above returns (tests/config checks this).
# Stack parameters are not listed: a missing NEI row is covered by the PSTK and global fall-backs.
[user_values.units]
molecular_weight = ["g/mol"]
vapor_pressure = ["mmHg", "torr", "Pa", "kPa", "hPa", "atm"]
density = ["g/cm^3", "kg/m^3"]
# The 8-hour time-weighted-average occupational exposure limit (OSHA PEL, NIOSH REL or ACGIH TLV).
oel_twa = ["mg/m^3", "ug/m^3"]
rfd = ["mg/(kg*day)"]
rfc = ["mg/m^3", "ug/m^3"]
sf = ["1/(mg/(kg*day))"]
iur = ["1/(ug/m^3)", "1/(mg/m^3)"]

# Plausible [minimum, maximum] per quantity, in its target unit. Outside it, a value is rejected
# with the range, never clipped.
[user_values.ranges]
molecular_weight = [1.0, 2000.0]
vapor_pressure = [1e-9, 10000.0]
density = [0.1, 25.0]
oel_twa = [1e-6, 100000.0]
rfd = [1e-8, 10.0]
rfc = [1e-8, 1000.0]
sf = [1e-6, 1000.0]
iur = [1e-9, 1000.0]

# Worker (occupational) screening: the EPA ChemSTEER mass-balance box model and RAGS Part F style
# worker dosimetry (models/exposure/occupational.py). Ventilation is a screening default for a
# manufacturing room, not the plant's; the worst case is an enclosed zone. A worker breathes
# `shift_inhalation_m3` in a shift against `daily_inhalation_m3` in 24 h (the resident rate).
[occupational]
shift_inhalation_m3 = 10.0
daily_inhalation_m3 = 20.0
worker_days_per_year = 250.0
tenure_years = 40.0
lifetime_years = 78.0
twa_hours = 8.0
# Vapor pressure at or below which a large fugitive release into workplace air is less
# plausible; used only for a warning, never in an equation.
low_volatility_mmhg = 0.001

# Risk tiers: "exceedance" above `exceedance_*`, otherwise "elevated" above `elevated_*`.
[occupational.thresholds]
exceedance_ratio = 1.0
elevated_ratio = 0.1
exceedance_hq = 1.0
elevated_hq = 0.1
exceedance_cancer_risk = 1e-4
elevated_cancer_risk = 1e-6

[occupational.ventilation.baseline]
label = "Baseline manufacturing ventilation"
rate_ft3_per_min = 3000.0
mixing_factor = 0.5

[occupational.ventilation.worst_case]
label = "Worst case, enclosed zone"
rate_ft3_per_min = 500.0
mixing_factor = 0.1

# CDR industrial sector (IS1 to IS48) of a facility, from its primary NAICS code
# (tools/emissions/helpers/inventory/sector.py). The file is EPA's own crosswalk, Table 5 of the
# IUR Technical Support Document "Replacement of 5-digit NAICS Codes with Industrial Sector (IS)
# Codes" (2009; NAICS 2007), and holds only the rows that table states; a code is matched most
# specific prefix first, and a code with no row has no sector (it is never inferred).
[cdr_sector]
crosswalk_path = "data/cdr_naics_industrial_sector.csv"
prefix_column = "naics_prefix"
code_column = "is_code"
title_column = "is_title"
edition_column = "naics_edition"
min_digits = 2
max_digits = 6

# Worst-case scenarios: the combination of factors behind the high-end value of a result, in one
# shape for every exposure pathway (tools/assessment/helpers/scenarios/). A pathway is one module
# there; its name, its quantities and the labels and units of its factors are the text below.
# A receptor is listed as most affected when its concentration under the scenario's own
# configuration is at least `receptor_fraction` of the scenario's maximum, up to `max_receptors`.
[scenario]
receptor_fraction = 0.5
max_receptors = 10

[scenario.pathways]
community_inhalation = "Outdoor Air → Inhalation → General Population"
worker_inhalation = "Indoor Air → Inhalation → Worker"

[scenario.quantities]
